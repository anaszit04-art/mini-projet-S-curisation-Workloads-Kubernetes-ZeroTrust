apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args:
          - "-text=Hello from Backend"
        ports:
          - containerPort: 5678
